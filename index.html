<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小工具箱</title>
<style>
:root{--bg:#0f1115;--card:#16181d;--line:#23262e;--fg:#e8eaed;--dim:#8b919b;--dim2:#4a4f58;--blue:#4d6bfe;--gold:#e3b341}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif}
.app{max-width:560px;margin:0 auto;padding:0 14px calc(30px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 0 6px}
h1{margin:0;font-size:19px;font-weight:600}
header p{margin:6px 0 0;font-size:12px;color:var(--dim2)}
.grid{margin-top:16px;display:flex;flex-direction:column;gap:10px}
a.card{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:15px 14px;text-decoration:none;color:inherit}
a.card:active{background:#1c1f26}
a.card .ico{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:20px;background:rgba(77,107,254,.14);border:1px solid rgba(77,107,254,.35)}
a.card .tx{min-width:0}
a.card .tx b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
a.card .tx span{font-size:11.5px;color:var(--dim);line-height:1.5;display:block}
a.card .go{margin-left:auto;color:var(--dim2);font-size:18px}
.sec{margin-top:22px;font-size:11.5px;color:var(--dim2);letter-spacing:.05em}
.foot{margin-top:24px;font-size:11px;color:var(--dim2);line-height:1.9;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>小工具箱</h1>
    <p>全部离线可用 · 打开即用 · 数据只存本机</p>
  </header>

  <div class="grid">
    <a class="card" href="./aa/">
      <div class="ico">💰</div>
      <div class="tx"><b>AA 分账</b><span>多人聚餐、旅行记账，自动算出谁给谁多少</span></div>
      <div class="go">›</div>
    </a>
    <a class="card" href="./todo/">
      <div class="ico">✅</div>
      <div class="tx"><b>待办清单</b><span>记事、勾完成、导出备份</span></div>
      <div class="go">›</div>
    </a>
    <a class="card" href="./kin/">
      <div class="ico">👨‍👩‍👧</div>
      <div class="tx"><b>亲戚称呼</b><span>爸爸的爸爸叫什么，远房堂表全覆盖，还有考题</span></div>
      <div class="go">›</div>
    </a>
  </div>

  <div class="sec">怎么装到手机桌面</div>
  <div style="font-size:12.5px;color:var(--dim);line-height:2;margin-top:8px">
    iPhone：Safari 打开 → 底部「分享」→ 添加到主屏幕<br>
    安卓：浏览器菜单 → 添加到主屏幕 / 安装应用
  </div>

  <div class="foot">链接可以直接转发给亲戚朋友，他们点开就能用，不用装任何东西</div>
</div>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/tools/sw.js").catch(function(){});});}</script></body>
</html>
