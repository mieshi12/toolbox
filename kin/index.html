<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>亲戚称呼</title>
<style>
:root{
  --bg:#0f1115;--card:#16181d;--card2:#1c1f26;--line:#23262e;--fg:#e8eaed;
  --dim:#8b919b;--dim2:#4a4f58;--blue:#4d6bfe;--gold:#e3b341;--green:#3fb950;--red:#f85149;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;padding:0 14px calc(24px + env(safe-area-inset-bottom));min-height:100%}
header{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 8px}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.02em}
header .tag{margin-left:auto;font-size:10.5px;color:var(--dim2);border:1px solid var(--line);
  border-radius:99px;padding:3px 9px}

.modes{display:flex;gap:6px;margin:4px 0 10px}
.modes button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:10px;padding:9px;font-size:13px;font-family:inherit}
.modes button.on{background:rgba(77,107,254,.16);border-color:rgba(77,107,254,.6);color:#cdd8ff}

.regions{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.regions button{background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:99px;padding:6px 12px;font-size:12px;font-family:inherit}
.regions button.on{background:rgba(227,179,65,.14);border-color:rgba(227,179,65,.55);color:var(--gold)}

.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:34px;
  padding:6px 0 4px;font-size:13px;color:var(--dim)}
.chain .me{color:var(--blue)}
.chain .chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;
  padding:4px 9px 4px 11px;color:#cfd4dc;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.chain .chip i{color:var(--dim2);font-style:normal;font-size:13px;line-height:1}

.result{background:linear-gradient(180deg,#1a1e27,#141720);border:1px solid var(--line);
  border-radius:16px;padding:18px 16px;margin:8px 0 14px;min-height:120px}
.result .big{font-size:38px;font-weight:700;letter-spacing:.04em;line-height:1.2;color:#fff}
.result .alt{margin-top:8px;font-size:13px;color:var(--gold);line-height:1.7}
.result .note{margin-top:8px;font-size:12px;color:var(--dim);line-height:1.6}
.result .note b{color:#b9c0ca;font-weight:500}
.result.blank .big{font-size:22px;color:var(--dim2);font-weight:500}

.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{background:var(--card);border:1px solid var(--line);color:#dfe3ea;border-radius:13px;
  padding:14px 0;font-size:15px;font-family:inherit;font-weight:500}
.keys button:active{background:#22262f;transform:scale(.98)}
.keys button.m{color:#9fb4ff;border-color:#2a3350}
.keys button.f{color:#ffb3c7;border-color:#4a2a34}
.keys button.d{color:#9be3b0;border-color:#28452f}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.row2 button{background:var(--card2);border:1px solid var(--line);color:var(--dim);
  border-radius:12px;padding:11px;font-size:13px;font-family:inherit}

.manual{display:flex;gap:8px;margin-top:12px}
.manual input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:12px;padding:12px 13px;font-size:14px;font-family:inherit;outline:none;min-width:0}
.manual button{background:var(--blue);border:0;color:#fff;border-radius:12px;padding:0 18px;
  font-size:14px;font-family:inherit}

.sec{margin-top:18px}
.sec .h{font-size:11.5px;color:var(--dim2);margin-bottom:9px;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{background:var(--card);border:1px solid var(--line);color:#c2c8d1;border-radius:99px;
  padding:7px 12px;font-size:12.5px;font-family:inherit}

.qcard{background:linear-gradient(180deg,#1a1e27,#141720);border:1px solid var(--line);
  border-radius:16px;padding:18px 16px;margin:4px 0 12px}
.qcard .q{font-size:17px;line-height:1.7;color:#fff}
.qcard .qh{margin-top:6px;font-size:11px;color:var(--dim2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opts button{background:var(--card2);border:1px solid var(--line);color:#dfe3ea;border-radius:12px;
  padding:14px 8px;font-size:15px;font-family:inherit}
.opts button:disabled{opacity:1}
.opts button.right{background:rgba(63,185,80,.18);border-color:rgba(63,185,80,.6);color:#7ee787}
.opts button.wrong{background:rgba(248,81,73,.16);border-color:rgba(248,81,73,.55);color:#ff9d97}
.qfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.qfoot .score{font-size:12px;color:var(--dim)}
.qfoot button{background:var(--blue);border:0;color:#fff;border-radius:11px;padding:10px 18px;
  font-size:13.5px;font-family:inherit;display:none}

.hidden{display:none!important}
.foot{margin-top:22px;font-size:11px;color:var(--dim2);line-height:1.9;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>亲戚称呼</h1>
    <span class="tag" id="tag">离线可用</span>
  </header>

  <div class="modes">
    <button id="mQuery" class="on">查称呼</button>
    <button id="mQuiz">考一考</button>
  </div>

  <div class="regions" id="regions"></div>

  <!-- 查询模式 -->
  <div id="viewQuery">
    <div class="chain" id="chain"><span class="me">我</span></div>

    <div class="result blank" id="result">
      <div class="big" id="big">从我出发</div>
      <div class="alt" id="alt"></div>
      <div class="note" id="note">点下面的「爸爸 / 妈妈」，一直点下去就看结果</div>
    </div>

    <div class="keys" id="keys"></div>

    <div class="row2">
      <button id="bUndo">退一步</button>
      <button id="bClear">清空重来</button>
    </div>

    <div class="manual">
      <input id="q" placeholder="直接打：爸爸的爸爸 / 老婆的哥哥" autocomplete="off">
      <button id="bCalc">查</button>
    </div>

    <div class="sec">
      <div class="h">常见问法（点一下）</div>
      <div class="chips" id="examples"></div>
    </div>

    <div class="sec">
      <div class="h">反查 · 这个称呼是什么关系</div>
      <div class="chips" id="revchips"></div>
    </div>

    <div class="sec">
      <div class="h">最近查过</div>
      <div class="chips" id="recent"></div>
    </div>
  </div>

  <!-- 测验模式 -->
  <div id="viewQuiz" class="hidden">
    <div class="qcard">
      <div class="q" id="qText">准备出题…</div>
      <div class="qh" id="qHint">从「我」出发，选一个称呼</div>
    </div>
    <div class="opts" id="qOpts"></div>
    <div class="qfoot">
      <span class="score" id="qScore">答对 0 / 0</span>
      <button id="qNext">下一题</button>
    </div>
    <div class="sec">
      <div class="h">说明</div>
      <div style="font-size:12px;color:var(--dim);line-height:1.9">
        随机出题，题干是一个关系链，四个选项里选正确的称谓。答错会亮出正确答案。
        题库由称谓引擎实时生成，不重复刷同一批题。
      </div>
    </div>
  </div>

  <div class="foot">数据只在本机 · 不联网也能用 · 覆盖直系、旁系、堂表、再从、姻亲</div>
</div>

<script>
/* kinship.js — 中文亲属称谓引擎（纯函数，离线可用）
   用法：Kin.parse('爸爸的爸爸') -> ['F','F']；Kin.naming(codes) -> {main, alt, note} */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Kin = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var WORDS = {
    F: ['爸爸', '父亲', '爸', '爹', '老爹', '老爸', '家父'],
    M: ['妈妈', '母亲', '妈', '娘', '老妈', '家母'],
    S: ['儿子', '儿'],
    D: ['女儿', '闺女'],
    B: ['哥哥', '哥', '兄长', '大哥', '兄'],
    b: ['弟弟', '弟', '小弟'],
    Z: ['姐姐', '姐', '姊', '大姐'],
    z: ['妹妹', '妹', '小妹'],
    H: ['丈夫', '老公', '先生', '夫君'],
    W: ['妻子', '老婆', '太太', '媳妇', '夫人']
  };
  var CODE2WORD = { F: '爸爸', M: '妈妈', S: '儿子', D: '女儿', B: '哥哥', b: '弟弟', Z: '姐姐', z: '妹妹', H: '丈夫', W: '妻子' };

  var LOOK = {};
  Object.keys(WORDS).forEach(function (k) { WORDS[k].forEach(function (w) { LOOK[w] = k; }); });
  var KEYS = Object.keys(LOOK).sort(function (a, b) { return b.length - a.length; });

  // 复合称谓 → 关系链（让"爷爷的哥哥"这种输入也能算）
  var EXO = {
    '爷爷': ['F', 'F'], '祖父': ['F', 'F'], '阿公': ['F', 'F'],
    '奶奶': ['F', 'M'], '祖母': ['F', 'M'], '阿婆': ['F', 'M'],
    '外公': ['M', 'F'], '姥爷': ['M', 'F'], '外祖父': ['M', 'F'],
    '外婆': ['M', 'M'], '姥姥': ['M', 'M'], '外祖母': ['M', 'M'],
    '太爷爷': ['F', 'F', 'F'], '曾祖父': ['F', 'F', 'F'], '老爷爷': ['F', 'F', 'F'],
    '太奶奶': ['F', 'F', 'M'], '曾祖母': ['F', 'F', 'M'], '老奶奶': ['F', 'F', 'M'],
    '太外公': ['M', 'F', 'F'], '外曾祖父': ['M', 'F', 'F'],
    '太外婆': ['M', 'F', 'M'], '外曾祖母': ['M', 'F', 'M'],
    '伯父': ['F', 'B'], '伯伯': ['F', 'B'], '大伯': ['F', 'B'],
    '叔父': ['F', 'b'], '叔叔': ['F', 'b'], '小叔': ['F', 'b'],
    '姑姑': ['F', 'Z'], '姑妈': ['F', 'Z'], '姑母': ['F', 'Z'],
    '舅舅': ['M', 'B'], '舅父': ['M', 'B'], '大舅': ['M', 'B'],
    '姨妈': ['M', 'Z'], '姨母': ['M', 'Z'], '阿姨': ['M', 'Z'], '小姨': ['M', 'Z'],
    '侄子': ['B', 'S'], '侄儿': ['B', 'S'], '侄女': ['B', 'D'],
    '外甥': ['Z', 'S'], '外甥女': ['Z', 'D'],
    '孙子': ['S', 'S'], '孙女': ['S', 'D'], '外孙': ['D', 'S'], '外孙女': ['D', 'D'],
    '曾孙': ['S', 'S', 'S'], '曾孙女': ['S', 'S', 'D'],
    '堂哥': ['F', 'B', 'S'], '堂兄': ['F', 'B', 'S'], '堂弟': ['F', 'b', 'S'],
    '堂姐': ['F', 'B', 'D'], '堂妹': ['F', 'b', 'D'],
    '表哥': ['M', 'B', 'S'], '表兄': ['M', 'B', 'S'], '表弟': ['M', 'B', 'S'],
    '表姐': ['M', 'B', 'D'], '表妹': ['M', 'B', 'D'],
    '岳父': ['W', 'F'], '老丈人': ['W', 'F'], '岳母': ['W', 'M'], '丈母娘': ['W', 'M'],
    '公公': ['H', 'F'], '婆婆': ['H', 'M'],
    '嫂子': ['B', 'W'], '弟媳': ['b', 'W'], '姐夫': ['Z', 'H'], '妹夫': ['z', 'H'],
    '儿媳': ['S', 'W'], '女婿': ['D', 'H'],
    '伯母': ['F', 'B', 'W'], '婶母': ['F', 'b', 'W'], '婶婶': ['F', 'b', 'W'],
    '姑父': ['F', 'Z', 'H'], '舅母': ['M', 'B', 'W'], '姨父': ['M', 'Z', 'H'],
    '伯公': ['F', 'F', 'B'], '叔公': ['F', 'F', 'b'], '姑婆': ['F', 'F', 'Z'],
    '舅公': ['F', 'M', 'B'], '姨婆': ['F', 'M', 'Z'],
    '伯祖父': ['F', 'F', 'B'], '叔祖父': ['F', 'F', 'b'], '姑祖母': ['F', 'F', 'Z'],
    '舅祖父': ['F', 'M', 'B'], '姨祖母': ['F', 'M', 'Z'],
    '曾伯祖父': ['F', 'F', 'F', 'B'],
    '大舅子': ['W', 'B'], '小舅子': ['W', 'b'], '大姨子': ['W', 'Z'], '小姨子': ['W', 'z'],
    '大伯子': ['H', 'B'], '小叔子': ['H', 'b'], '大姑子': ['H', 'Z'], '小姑子': ['H', 'z'],
    '堂侄': ['F', 'B', 'S', 'S'], '表侄': ['M', 'B', 'S', 'S'],
    '侄孙': ['B', 'S', 'S'], '外甥孙': ['Z', 'S', 'S'],
    '再从兄': ['F', 'F', 'B', 'S', 'S'], '再从弟': ['F', 'F', 'B', 'S', 'S'],
    '表叔': ['F', 'F', 'Z', 'S'], '表伯': ['F', 'F', 'Z', 'S'], '表姑': ['F', 'F', 'Z', 'D'],
    '堂叔': ['F', 'F', 'B', 'S'], '堂伯': ['F', 'F', 'B', 'S'], '堂姑': ['F', 'F', 'B', 'D'],
    '堂嫂': ['F', 'B', 'S', 'W'], '堂姐夫': ['F', 'B', 'D', 'H'], '表嫂': ['M', 'B', 'S', 'W'],
    '外甥孙': ['Z', 'S', 'S'], '侄孙女': ['B', 'S', 'D']
  };

  function sexOf(c) { return 'FSBbH'.indexOf(c) >= 0 ? 'm' : 'f'; }
  function isSib(c) { return 'BbZz'.indexOf(c) >= 0; }
  function isUp(c) { return c === 'F' || c === 'M'; }
  function isDown(c) { return c === 'S' || c === 'D'; }
  function isSpouse(c) { return c === 'H' || c === 'W'; }
  function cn(n) {
    var d = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    if (n <= 10) return d[n];
    if (n < 20) return '十' + d[n - 10];
    return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  }

  /* ---------- 文本 → 代码序列 ---------- */
  function parse(text) {
    if (!text) return [];
    var s = String(text).replace(/\s+/g, '').replace(/^(我的|我)/, '');
    if (!s) return [];
    var parts = s.split(/的|之/).filter(Boolean);
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (EXO[p]) { out.push.apply(out, EXO[p]); continue; }
      if (LOOK[p]) { out.push(LOOK[p]); continue; }
      var hit = null;
      for (var j = 0; j < KEYS.length; j++) if (p.indexOf(KEYS[j]) >= 0) { hit = LOOK[KEYS[j]]; break; }
      if (!hit) return null;
      out.push(hit);
    }
    return out;
  }
  function describe(codes) {
    return codes.map(function (c) { return CODE2WORD[c]; }).join('的');
  }

  /* ---------- 化简 ---------- */
  function reduce(codes) {
    var a = codes.slice(), guard = 0, changed = true;
    while (changed && guard++ < 64) {
      changed = false;
      for (var i = 0; i < a.length - 1; i++) {
        var x = a[i], y = a[i + 1];
        if (isSib(x) && isUp(y)) { a.splice(i, 2, y); changed = true; break; }
        if (isDown(x) && isUp(y)) { a.splice(i, 2); changed = true; break; }
        if (isSpouse(x) && isSpouse(y)) { a.splice(i, 2); changed = true; break; }
        if (isSib(x) && isSib(y)) { a.splice(i, 2, y); changed = true; break; }
      }
    }
    return a;
  }

  /* ---------- 坐标 ---------- */
  function analyze(codes) {
    var up = 0, down = 0, upSex = [], downSex = [], sib = null, sibIndex = -1;
    for (var i = 0; i < codes.length; i++) {
      var c = codes[i];
      if (c === 'F') { up++; upSex.push('m'); }
      else if (c === 'M') { up++; upSex.push('f'); }
      else if (isSib(c)) {
        up++; upSex.push('m');
        down++; downSex.push(sexOf(c));
        sib = { elder: (c === 'B' || c === 'Z') ? 'older' : 'younger', sex: sexOf(c), at: i };
        sibIndex = i;
      }
      else if (c === 'S') { down++; downSex.push('m'); }
      else if (c === 'D') { down++; downSex.push('f'); }
    }
    return { up: up, down: down, upSex: upSex, downSex: downSex, sib: sib, sibIndex: sibIndex };
  }

  /* ---------- 名表 ---------- */
  var UP_BOOK_M = ['', '父亲', '祖父', '曾祖父', '高祖父', '天祖父', '烈祖父', '太祖父', '远祖父', '鼻祖父'];
  var UP_BOOK_F = ['', '母亲', '祖母', '曾祖母', '高祖母', '天祖母', '烈祖母', '太祖母', '远祖母', '鼻祖母'];
  var UP_OUT_M = ['', '爸爸', '爷爷', '太爷爷', '高祖父', '天祖父', '烈祖父', '太祖父', '远祖父', '鼻祖父'];
  var UP_OUT_F = ['', '妈妈', '奶奶', '太奶奶', '高祖母', '天祖母', '烈祖母', '太祖母', '远祖母', '鼻祖母'];
  var DOWN_M = ['', '儿子', '孙子', '曾孙', '玄孙', '来孙', '晜孙', '仍孙', '云孙', '耳孙'];
  var DOWN_F = ['', '女儿', '孙女', '曾孙女', '玄孙女', '来孙女', '晜孙女', '仍孙女', '云孙女', '耳孙女'];

  function upResult(n, sex, wai) {
    var m = sex === 'm', main, alt;
    if (n === 1) {
      main = m ? '爸爸' : '妈妈';
      alt = m ? ['父亲', '爹', '老爸'] : ['母亲', '娘', '老妈'];
    } else if (n === 2) {
      if (wai) { main = m ? '外公' : '外婆'; alt = m ? ['外祖父', '姥爷', '阿公'] : ['外祖母', '姥姥', '阿婆']; }
      else { main = m ? '爷爷' : '奶奶'; alt = m ? ['祖父', '阿公'] : ['祖母', '阿婆']; }
    } else if (n === 3) {
      if (wai) { main = m ? '太外公' : '太外婆'; alt = [m ? '外曾祖父' : '外曾祖母']; }
      else { main = m ? '太爷爷' : '太奶奶'; alt = [m ? '曾祖父' : '曾祖母', m ? '老爷爷' : '老奶奶']; }
    } else if (n <= 9) {
      main = (wai ? '外' : '') + (m ? UP_BOOK_M[n] : UP_BOOK_F[n]);
      alt = [m ? UP_OUT_M[n] : UP_OUT_F[n]];
    } else {
      main = (wai ? '外' : '') + '第' + n + '代' + (m ? '祖父' : '祖母');
      alt = [m ? '上' + n + '代男性直系祖先' : '上' + n + '代女性直系祖先'];
    }
    return { main: main, alt: alt, sex: sex, kind: { type: 'up', n: n, wai: !!wai, sex: sex } };
  }

  function downResult(n, sex, wai) {
    var m = sex === 'm', main, alt = [];
    if (n === 1) {
      main = m ? '儿子' : '女儿';
      alt = m ? ['犬子', '儿'] : ['闺女', '千金'];
    } else if (n === 2) {
      if (wai) main = m ? '外孙' : '外孙女';
      else main = m ? '孙子' : '孙女';
      alt = m ? ['男孙'] : ['女孙'];
    } else if (n <= 9) {
      main = (wai ? '外' : '') + (m ? DOWN_M[n] : DOWN_F[n]);
      alt = [m ? '下' + n + '代男性直系' : '下' + n + '代女性直系'];
    } else {
      main = (wai ? '外' : '') + '第' + n + '代孙';
      alt = [];
    }
    return { main: main, alt: alt, sex: sex, kind: { type: 'down', n: n, wai: !!wai, sex: sex } };
  }

  function tangPrefix(n) {
    if (n === 2) return '堂';
    if (n === 3) return '再从';
    if (n === 4) return '三从';
    return cn(n - 1) + '从';
  }
  function biaoPrefix(n) {
    if (n === 2) return '表';

let quizScore = { right: 0, total: 0 };
try {
  const s = JSON.parse(localStorage.getItem(SCORE_KEY) || 'null');
  if (s && typeof s.right === 'number') quizScore = s;
} catch (e) {}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function makeQuiz() {
  for (let attempt = 0; attempt < 120; attempt++) {
    const n = 2 + Math.floor(Math.random() * 2);
    const parts = [];
    for (let i = 0; i < n; i++) parts.push(STEPS[Math.floor(Math.random() * STEPS.length)]);
    const text = parts.join('的');
    const c = Kin.parse(text);
    if (!c) continue;
    const r = Kin.naming(c);
    if (!r || !r.main) continue;
    const ans = r.main;
    if (ans.indexOf('/') >= 0 || ans.length > 4 || ans === '我自己' || ans === '我') continue;
    const pool = DISTRACT.filter(x => x !== ans);
    const opts = [ans];
    while (opts.length < 4) {
      const cand = pool[Math.floor(Math.random() * pool.length)];
      if (opts.indexOf(cand) < 0) opts.push(cand);
    }
    return { text: text, ans: ans, opts: shuffle(opts), note: Kin.describe(c) };
  }
  return null;
}

function renderQuiz() {
  quizCur = makeQuiz();
  if (!quizCur) return;
  $('#qText').textContent = quizCur.text + ' 叫什么？';
  $('#qHint').textContent = '从「我」出发 · ' + quizCur.text;
  const box = $('#qOpts');
  box.innerHTML = '';
  quizCur.opts.forEach(o => {
    const b = document.createElement('button');
    b.textContent = localize(o);
    b.dataset.k = o;
    b.onclick = () => answerQuiz(b, o);
    box.appendChild(b);
  });
  $('#qNext').style.display = 'none';
  $('#qScore').textContent = '答对 ' + quizScore.right + ' / ' + quizScore.total;
}

function answerQuiz(btn, picked) {
  const q = quizCur;
  if (!q) return;
  quizScore.total++;
  if (picked === q.ans) quizScore.right++;
  try { localStorage.setItem(SCORE_KEY, JSON.stringify(quizScore)); } catch (e) {}
  const nodes = document.querySelectorAll('#qOpts button');
  nodes.forEach(b => {
    b.disabled = true;
    if (b.dataset.k === q.ans) b.classList.add('right');
    else if (b === btn) b.classList.add('wrong');
  });
  $('#qHint').textContent = (picked === q.ans ? '对了 · ' : '正确答案：' + localize(q.ans) + ' · ') + q.note;
  $('#qScore').textContent = '答对 ' + quizScore.right + ' / ' + quizScore.total;
  $('#qNext').style.display = 'block';
}

/* ---------- 渲染区 ---------- */
const kb = $('#keys');
KEYS.forEach(k => {
  const b = document.createElement('button');
  b.className = k.cls;
  b.textContent = k.w;
  b.onclick = () => { chain.push(k); render(); };
  kb.appendChild(b);
});

$('#bUndo').onclick = () => { chain.pop(); render(); };
$('#bClear').onclick = () => { chain = []; render(); };
$('#bCalc').onclick = () => { const t = $('#q').value.trim(); if (t) byText(t); };
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('#bCalc').click(); }
});

const ex = $('#examples');
EXAMPLES.forEach(t => {
  const b = document.createElement('button');
  b.textContent = t;
  b.onclick = () => byText(t);
  ex.appendChild(b);
});

const rv = $('#revchips');
Kin.reverseTable.slice(0, 28).forEach(([name, path]) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { byText(path); $('#q').value = path; };
  rv.appendChild(b);
});

/* 地区按钮 */
const rg = $('#regions');
Object.keys(REGIONS).forEach(name => {
  const b = document.createElement('button');
  b.textContent = name;
  b.className = (name === region) ? 'on' : '';
  b.onclick = () => {
    region = name;
    try { localStorage.setItem('kin_region', name); } catch (e) {}
    Array.from(rg.children).forEach(x => x.classList.toggle('on', x.textContent === name));
    if (lastResult) show(lastResult, lastText);
    if (quizCur) {
      const nodes = document.querySelectorAll('#qOpts button');
      nodes.forEach(n => { if (!n.disabled) n.textContent = localize(n.dataset.k); });
    }
  };
  rg.appendChild(b);
});

$('#mQuery').onclick = () => setMode('query');
$('#mQuiz').onclick = () => setMode('quiz');
$('#qNext').onclick = renderQuiz;

renderRecent();
render();
$('#qScore').textContent = '答对 ' + quizScore.right + ' / ' + quizScore.total;
</script>
</body>
</html>
